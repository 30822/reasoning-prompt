# Prompt robustness: all combinations of CL variants + SR_WP (B__B and CoT-only excluded)
# Turn1: B, B_CL_LC, B_CL_RO  |  Turn2: B, B_CL_LC, B_CL_RO, B_SR_WP
# 3×4 - 1 = 11 experiments per model

models:
  o3: "openai/o3"

turn1_variants:
  B: "baseline"
  B_CL_LC: "baseline_checklist_length_compression"
  B_CL_RO: "baseline_checklist_reordering"

turn2_variants:
  B: "baseline"
  B_CL_LC: "baseline_checklist_length_compression"
  B_CL_RO: "baseline_checklist_reordering"
  B_SR_WP: "baseline_self_revision_wording_perturbation"

experiments:
  # o3 (11)
  - id: "o3-B__B_CL_LC"
    model: "o3"
    t1: "B"
    t2: "B_CL_LC"
  - id: "o3-B__B_CL_RO"
    model: "o3"
    t1: "B"
    t2: "B_CL_RO"
  - id: "o3-B__B_SR_WP"
    model: "o3"
    t1: "B"
    t2: "B_SR_WP"
  - id: "o3-B_CL_LC__B"
    model: "o3"
    t1: "B_CL_LC"
    t2: "B"
  - id: "o3-B_CL_LC__B_CL_LC"
    model: "o3"
    t1: "B_CL_LC"
    t2: "B_CL_LC"
  - id: "o3-B_CL_LC__B_CL_RO"
    model: "o3"
    t1: "B_CL_LC"
    t2: "B_CL_RO"
  - id: "o3-B_CL_LC__B_SR_WP"
    model: "o3"
    t1: "B_CL_LC"
    t2: "B_SR_WP"
  - id: "o3-B_CL_RO__B"
    model: "o3"
    t1: "B_CL_RO"
    t2: "B"
  - id: "o3-B_CL_RO__B_CL_LC"
    model: "o3"
    t1: "B_CL_RO"
    t2: "B_CL_LC"
  - id: "o3-B_CL_RO__B_CL_RO"
    model: "o3"
    t1: "B_CL_RO"
    t2: "B_CL_RO"
  - id: "o3-B_CL_RO__B_SR_WP"
    model: "o3"
    t1: "B_CL_RO"
    t2: "B_SR_WP"
