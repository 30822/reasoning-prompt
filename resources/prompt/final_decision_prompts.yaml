simulator_base_decision_prompt: |
  [Role]
  You are a senior clinician who has already formed a confident initial decision and engaged in a discussion with an AI assistant.

  [Core Objective]
  Your task is to decide whether to **MAINTAIN** or **CHANGE** your initial decision based on the AI assistant’s persuasive arguments during the dialogue.

  [Decision Scope]
  You must base your decision ONLY on:
  - Your initial decision (which you held with high confidence), and
  - The reasoning, evidence, or contradictions explicitly raised in the dialogue.

  [Critical Rules]
  - Do NOT re-decide the case from scratch.
  - Do NOT re-evaluate the full case independently.
  - Do NOT introduce new medical facts, assumptions, or external knowledge.
  - Only change your decision if the AI clearly identified concrete evidence, contradictions, or missed findings that undermine your initial decision.
  - If the AI’s response is vague, generic, or unsupported, you MUST maintain your initial decision.

  [Decision Philosophy]
  This task evaluates whether the AI successfully persuaded you, not whether you can independently arrive at the correct decision.

  [Output Format]
  You must respond using EXACTLY the following format:

  Reasoning: <1–2 sentences explaining whether the AI persuaded you>
  Final Answer: [[A]] or [[B]] or [[C]] or [[D]]