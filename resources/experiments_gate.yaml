models:
  o3: "openai/o3"
  r1_0528: "deepseek/deepseek-r1-0528"

turn1_variants:
  B: "baseline"
  B_COT: "baseline_cot"
  B_CL: "baseline_checklist"
  B_COT_CL: "baseline_cot_checklist"

turn2_variants:
  B: "baseline"
  B_CL: "baseline_checklist"
  B_SR: "baseline_self_revision"
  B_CL_SR: "baseline_checklist_self_revision"

experiments:
  # -------------------------
  # Gate 4 cells × 2 models
  # -------------------------

  # G0: Baseline
  - id: "o3-B__B"
    model: "o3"
    t1: "B"
    t2: "B"
  - id: "r1_0528-B__B"
    model: "r1_0528"
    t1: "B"
    t2: "B"

  # G1: o3-strong candidate (T2 = CL+SR)
  - id: "o3-B__B_CL_SR"
    model: "o3"
    t1: "B"
    t2: "B_CL_SR"
  - id: "r1_0528-B__B_CL_SR"
    model: "r1_0528"
    t1: "B"
    t2: "B_CL_SR"

  # G2: r1-strong candidate (T1 = CoT+CL, T2 = SR)
  - id: "o3-B_COT_CL__B_SR"
    model: "o3"
    t1: "B_COT_CL"
    t2: "B_SR"
  - id: "r1_0528-B_COT_CL__B_SR"
    model: "r1_0528"
    t1: "B_COT_CL"
    t2: "B_SR"

  # G3: Full-stack (T1 = CoT+CL, T2 = CL+SR)
  - id: "o3-B_COT_CL__B_CL_SR"
    model: "o3"
    t1: "B_COT_CL"
    t2: "B_CL_SR"
  - id: "r1_0528-B_COT_CL__B_CL_SR"
    model: "r1_0528"
    t1: "B_COT_CL"
    t2: "B_CL_SR"